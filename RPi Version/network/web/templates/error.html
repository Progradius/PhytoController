{% extends "base.html" %}
{% block content %}
<section class="hero compact">
  <p class="eyebrow">Erreur {{ status }}</p>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if previous_url %}<a class="button button-secondary" href="{{ previous_url }}">Revenir à la page précédente</a>{% endif %}
  {% if retry_url %}<a class="button button-secondary" href="{{ retry_url }}">Réessayer</a>{% endif %}
  <a class="button" href="/">Retour au tableau de bord</a>
</section>
{% endblock %}
