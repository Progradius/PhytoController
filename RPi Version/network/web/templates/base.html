<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020604">
  {% if csrf_token %}<meta name="csrf-token" content="{{ csrf_token }}">{% endif %}
  <title>{{ page_title }} · PhytoController</title>
  <link rel="icon" href="/favicon.svg?v={{ asset_versions.favicon }}" type="image/svg+xml">
  <link rel="stylesheet" href="/static/css/style.css?v={{ asset_versions.style }}">
  {% block head_extra %}{% endblock %}
</head>
<body data-page="{{ current_page or 'error' }}">
  <a class="skip-link" href="#contenu">Aller au contenu</a>
  <header class="site-header">
    <div class="brand" aria-label="PhytoController">
      <span class="brand-mark" aria-hidden="true">⌁</span>
      <span>PHYTO<span class="brand-dim">CONTROLLER</span></span>
    </div>
    <nav class="navbar" aria-label="Navigation principale">
      <a href="/"{% if current_page == 'dashboard' %} aria-current="page"{% endif %}>Tableau de bord</a>
      <a href="/conf"{% if current_page == 'config' %} aria-current="page"{% endif %}>Configuration</a>
      <a href="/console"{% if current_page == 'console' %} aria-current="page"{% endif %}>Console</a>
    </nav>
  </header>
  <main id="contenu" class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">PHYTO · CONTRÔLE LOCAL LAN</footer>
  {% block page_scripts %}{% endblock %}
</body>
</html>
